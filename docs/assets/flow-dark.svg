<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="Sources are fetched and cached, written into one region of the hosts file, and read by every app">
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
      <rect x="8" y="58" width="228" height="118" rx="14"/>
      <rect x="286" y="58" width="228" height="118" rx="14"/>
      <rect x="564" y="58" width="228" height="118" rx="14" stroke="#4493f8" stroke-width="2"/>
      <rect x="842" y="58" width="250" height="118" rx="14"/>
    </g>
    <g fill="#e6edf3" font-size="19" font-weight="700">
      <text x="34" y="98">Sources</text>
      <text x="312" y="98">Fetch + cache</text>
      <text x="590" y="98">One region</text>
      <text x="868" y="98">Every app</text>
    </g>
    <g fill="#9198a1" font-size="14">
      <text x="34" y="128">catalog · URL · file</text>
      <text x="34" y="150">you choose the lists</text>
      <text x="312" y="128">ETag + 304</text>
      <text x="312" y="150">/etc/blk/cache</text>
      <text x="590" y="128"># BEGIN blk</text>
      <text x="590" y="150"># END blk</text>
      <text x="868" y="128">browser · Spotify</text>
      <text x="868" y="150">games · CLI · tools</text>
    </g>
    <text x="660" y="212" font-size="13" fill="#6e7681">read by the system resolver</text>
    <g stroke="#6e7681" stroke-width="1.8" fill="none">
      <line x1="240" y1="117" x2="272" y2="117"/>
      <line x1="518" y1="117" x2="550" y2="117"/>
      <line x1="796" y1="117" x2="828" y2="117"/>
    </g>
    <g fill="#6e7681">
      <path d="M278 117l-10-5v10z"/>
      <path d="M556 117l-10-5v10z"/>
      <path d="M834 117l-10-5v10z"/>
    </g>
  </g>
</svg>
